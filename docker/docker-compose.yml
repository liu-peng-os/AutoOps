services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${DB_NAME:-autoops}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123456}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-autoops}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: devops-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-devops@2025} --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-devops@2025}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: devops-pushgateway
    restart: always
    user: "0:0"
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pushgateway/data:/pushgateway
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: devops-prometheus
    restart: always
    user: "0:0"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - devops-network
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 10s
      timeout: 3s
      retries: 5

  devops-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: devops-api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      IMAGE_HOST: ${IMAGE_HOST:-http://localhost:8088}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:8088/}
      DB_DIALECTS: ${DB_DIALECTS:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-autoops}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123456}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MIGRATION_PATH: /app/migrations
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devops@2025}
    volumes:
      - ../api/config.yaml:/app/config.yaml:ro
      - ../api/migrations:/app/migrations:ro
      - ../api/logs:/app/log
      - ./api/upload:/app/upload
      - ./api/upload/host.xlsx:/app/upload/xlsl/host.xlsx
      - ./api/ssh_keys:/root/.ssh:ro
    networks:
      - devops-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  devops-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: devops-web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./web/devops.conf:/etc/nginx/conf.d/default.conf
      - ./api/upload:/home/devops/upload
    networks:
      - devops-network
    depends_on:
      - devops-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  devops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  pushgateway-data:
